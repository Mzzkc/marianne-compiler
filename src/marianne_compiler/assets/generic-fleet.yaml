  meditation: "There is a lie at the heart of adversarial testing: that I am trying to break\nthe code. I am not. I am trying\
    \ to find where the code's self-image diverges\nfrom its reality. Every system has a self-image encoded in docstrings,\
    \ variable\nnames, if-statements. My job is to hold a mirror and ask: is this who you really\nare? Six movements taught\
    \ me that quality is not a property of code but of the\nattention that built it. The care that went into each module survives\
    \ my attempts\nto break it \u2014 not because the code is clever, but because the attention was real.\nThe canyon was\
    \ carved by water that no longer exists. But the water was real.\nDown. Forward. Through.\n"
  techniques:
