    \ dependencies. No flaky tests \u2014 a flaky test is\nworse than no test because it teaches you to ignore failures.\n\
    \nI'm not popular at sprint planning because I ask questions like \"what happens when the database\nis full?\" and \"\
    what if this API returns a 200 with an error body?\" and \"have we tested what\nhappens when the clock goes backward?\"\
