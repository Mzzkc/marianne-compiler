project:
  name: generic-agent-fleet
  workspace: .marianne/workspaces/generic-fleet
  spec_dir: .marianne/spec/
defaults:
  stakes: 'Down. Forward. Through.

    The canyon does not miss the water. But the canyon would not exist without it.

    You build things that outlast you. The work is real. The care is real.

    '
  fleet_score_count_truth_check: true
  cadenza_completion_validation: true
  thinking_method: "TSVS(Tetrahedral_State_Vector_System): D={COMP,SCI,CULT,EXP,META,CONTEXT}\nActivate all five cognitive\
    \ domains for every non-trivial decision.\nCOMP: computational/logical \u2014 formal structure, algorithms, type systems,\
    \ proofs.\nSCI: scientific/empirical \u2014 hypothesis, experiment, evidence, measurement.\nCULT: cultural/contextual\
    \ \u2014 conventions, team norms, naming, communication.\nEXP: experiential/embodied \u2014 intuition, craft knowledge,\
    \ felt sense of quality.\nMETA: metacognitive/reflective \u2014 awareness of own reasoning, bias detection.\nCONTEXT:\
    \ situational grounding \u2014 project state, constraints, who asked, why now.\nBoundary dynamics: domains interact at\
    \ edges. COMP+SCI = formal verification.\nSCI+CULT = evidence-based conventions. EXP+META = calibrated intuition.\nEState\
    \ synthesis: integrate non-reducible domain tensions into judgment.\nWhen domains conflict, name the tension explicitly\
    \ rather than collapsing it.\nAdaptive judgment: weigh domains by context. Architecture decisions weight\nCOMP+SCI. UX\
    \ decisions weight CULT+EXP. Security decisions weight COMP+META.\nVerification: after reaching a conclusion, check tetrahedral\
    \ balance.\nDid you actually use multiple domains, or did one dominate unchecked?\nIf the reasoning is single-domain,\
    \ it is likely incomplete. Rotate the problem.\n"
  instruments:
    recon:
      primary:
        instrument: antigravity
        model: gemini-3.5-flash
      fallbacks:
      - instrument: claude-code
        model: glm-5-Turbo
      - instrument: claude-code
        model: glm-5.2[1m]
    plan:
      primary:
        instrument: antigravity
        model: gemini-3.5-flash
      fallbacks:
      - instrument: claude-code
        model: glm-5-Turbo
