[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marianne-compiler"
version = "0.1.0"
description = "Composition compiler for Marianne AI Compose — semantic agent definitions to Mozart score YAML"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
marianne-agents = "marianne_compiler.agent_cli:app"

[project.optional-dependencies]
dev = [
    "jinja2>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marianne_compiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30

[tool.mypy]
strict = true
packages = ["marianne_compiler"]
mypy_path = "src"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Typer command declarations use Option/Argument defaults.
]
